[project]
name = "stat-486-lab-10"
version = "0.1.0"
description = "STAT 486 Lab 10: CNN Classification and Learned Representations"
requires-python = "==3.11.5"
dependencies = [
    "ipykernel>=6.29,<7",
    "matplotlib>=3.9,<4",
    "numpy>=1.26,<3",
    "scikit-learn==1.7.2",
    "torch==2.9.1+cpu; sys_platform == 'linux' or sys_platform == 'win32'",
    "torch==2.9.1; sys_platform != 'linux' and sys_platform != 'win32'",
    "torchvision==0.24.1+cpu; sys_platform == 'linux' or sys_platform == 'win32'",
    "torchvision==0.24.1; sys_platform != 'linux' and sys_platform != 'win32'",
]

[tool.uv]
package = false

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
torchvision = [
    { index = "pytorch-cpu", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
